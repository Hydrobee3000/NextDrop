<section class="not-found">
  <svg class="nf-illustration" viewBox="0 -60 320 300" role="img" [attr.aria-label]="'notFound.imageAlt' | translate">
    <ellipse class="nf-ground" cx="150" cy="222" rx="96" ry="9" />

    <g class="nf-float">
      <path class="nf-cable" d="M150 96 C150 58 196 80 232 50" />
      <g class="nf-plug" transform="translate(232 50) rotate(-37)">
        <rect class="nf-plug-prong" x="24" y="-6" width="9" height="4" rx="1" />
        <rect class="nf-plug-prong" x="24" y="2" width="9" height="4" rx="1" />
        <rect class="nf-plug-body" x="0" y="-9" width="26" height="18" rx="4" />
      </g>
      <g class="nf-sparks">
        <path d="M264 25 L272 17" />
        <path d="M266 31 L276 32" />
        <path d="M259 22 L258 12" />
      </g>

      <path
        class="nf-pad-shadow"
        transform="translate(0 7)"
        d="M90 96 H210 C245 96 262 121 268 151 C274 181 266 201 246 201 C230 201 220 189 208 173 H92 C80 189 70 201 54 201 C34 201 26 181 32 151 C38 121 55 96 90 96 Z"
      />
      <path
        class="nf-pad"
        d="M90 96 H210 C245 96 262 121 268 151 C274 181 266 201 246 201 C230 201 220 189 208 173 H92 C80 189 70 201 54 201 C34 201 26 181 32 151 C38 121 55 96 90 96 Z"
      />

      <path class="nf-dpad" d="M74 118 h12 v8 h8 v12 h-8 v8 h-12 v-8 h-8 v-12 h8 z" />

      <g class="nf-buttons">
        <circle class="nf-btn nf-btn--cyan" cx="220" cy="119" r="6.5" />
        <circle class="nf-btn nf-btn--orange" cx="233" cy="132" r="6.5" />
        <circle class="nf-btn nf-btn--rose" cx="220" cy="145" r="6.5" />
        <circle class="nf-btn nf-btn--light" cx="207" cy="132" r="6.5" />
      </g>

      <path class="nf-brow" d="M117 107 L139 101" />
      <path class="nf-brow" d="M161 101 L183 107" />
      <g class="nf-eye nf-eye--left">
        <circle class="nf-eye-white" cx="130" cy="125" r="14" />
        <circle class="nf-pupil" cx="134.5" cy="120.5" r="5.5" />
      </g>
      <g class="nf-eye nf-eye--right">
        <circle class="nf-eye-white" cx="170" cy="125" r="14" />
        <circle class="nf-pupil" cx="174.5" cy="120.5" r="5.5" />
      </g>
      <path class="nf-mouth" d="M140 157 q5 -5 10 0 t10 0" />
    </g>

    <g class="nf-digits">
      <g class="nf-bob nf-bob--four"><path class="nf-digit nf-digit--orange" transform="translate(106 -6)" fill-rule="evenodd" d="M19 -47 H4 L-22 -17 V-6 H4 V0 H19 V-6 H25 V-17 H19 Z M4 -35 L-12 -17 H4 Z" /></g>
      <g class="nf-bob nf-bob--zero"><path class="nf-digit nf-digit--lime" transform="translate(160 -6)" fill-rule="evenodd" d="M-19 -24 a19 24 0 1 0 38 0 a19 24 0 1 0 -38 0 Z M-8 -24 a8 13 0 1 0 16 0 a8 13 0 1 0 -16 0 Z" /></g>
      <g class="nf-bob nf-bob--four-late"><path class="nf-digit nf-digit--orange" transform="translate(214 -6)" fill-rule="evenodd" d="M19 -47 H4 L-22 -17 V-6 H4 V0 H19 V-6 H25 V-17 H19 Z M4 -35 L-12 -17 H4 Z" /></g>
    </g>

    <g class="nf-questions">
      <g transform="translate(104 92)">
        <g class="nf-q nf-q--1"><text class="nf-q-lime" font-size="30" text-anchor="middle">?</text></g>
      </g>
      <g transform="translate(126 92) rotate(10)">
        <g class="nf-q nf-q--2"><text class="nf-q-cyan" font-size="22" text-anchor="middle">?</text></g>
      </g>
      <g transform="translate(142 92)">
        <g class="nf-q nf-q--3"><text class="nf-q-lime" font-size="26" text-anchor="middle">?</text></g>
      </g>
    </g>
  </svg>

  <h1 class="not-found__title">{{ 'notFound.title' | translate }}</h1>
  <p class="not-found__text">{{ 'notFound.text' | translate }}</p>
  <a class="not-found__home" routerLink="/">{{ 'notFound.home' | translate }}</a>
</section>
