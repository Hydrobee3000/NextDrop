<div class="home-header">
  <h2>Скоро выходят</h2>
  <div class="home-filters">
    @for (filter of filters; track filter) {
      <span class="home-filter" [class.active]="filter === 'Все'">{{ filter }}</span>
    }
  </div>
</div>

<div class="home-highlight">
  <app-game-hero
    [title]="heroGame.title"
    [platforms]="heroGame.platforms"
    [coverInitials]="heroGame.coverInitials"
    [coverGradient]="heroGame.coverGradient"
    [daysUntilRelease]="heroGame.daysUntilRelease"
    [releaseDateLabel]="heroGame.releaseDateLabel"
  />

  <div class="home-side-list">
    @for (game of sideGames; track game.id) {
      <app-game-row
        [title]="game.title"
        [platforms]="game.platforms"
        [coverInitials]="game.coverInitials"
        [coverGradient]="game.coverGradient"
        [daysUntilRelease]="game.daysUntilRelease"
      />
    }
  </div>
</div>

<h3 class="home-section-title">Все ожидаемые</h3>

<div class="game-grid">
  @for (game of games; track game.id) {
    <app-game-card
      [title]="game.title"
      [platforms]="game.platforms"
      [coverInitials]="game.coverInitials"
      [coverGradient]="game.coverGradient"
      [daysUntilRelease]="game.daysUntilRelease"
    />
  }
</div>
