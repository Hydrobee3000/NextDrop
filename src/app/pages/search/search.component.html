<app-game-filters title="Поиск" [activeFilter]="activeFilter" (activeFilterChange)="selectFilter($event)" />

<input
  class="search-input"
  type="text"
  placeholder="Название игры…"
  [formControl]="queryControl"
/>

@if (results$ | async; as results) {
  @if (results.length > 0) {
    <div class="search-results">
      @for (game of results; track game.id) {
        <app-game-row
          [title]="game.title"
          [platforms]="game.platforms"
          [coverImageUrl]="game.coverImageUrl"
          [coverInitials]="game.coverInitials"
          [coverGradient]="game.coverGradient"
          [daysUntilRelease]="game.daysUntilRelease"
          [activeFilter]="activeFilter"
        />
      }
    </div>
  } @else if (queryControl.value.trim()) {
    <p class="search-empty">Ничего не нашлось.</p>
  }
}
