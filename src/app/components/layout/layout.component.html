<div class="layout">
  <nav class="layout__nav">
    <span class="layout__brand">
      <span class="layout__brand-icon-badge">
        <svg class="layout__brand-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
          <path d="M12 8a4 4 0 0 0-4 4c0 1.1.45 2.1 1.17 2.83" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" />
        </svg>
      </span>
      <span class="layout__brand-text"><span class="layout__brand-next">Next</span><span class="layout__brand-drop">Drop</span></span>
    </span>

    <div class="layout__nav-items">
      @for (item of navItems; track item.labelKey) {
        <a
          class="layout__nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        >
          @switch (item.icon) {
            @case ('house') { <svg lucideHouse></svg> }
            @case ('search') { <svg lucideSearch></svg> }
            @case ('heart') { <svg lucideHeart></svg> }
          }
          <span class="layout__nav-label">{{ item.labelKey | translate }}</span>
        </a>
      }
    </div>

    <div class="layout__controls">
      <app-theme-toggle />
      <app-language-switcher />
    </div>
  </nav>

  <main class="layout__content">
    <ng-content></ng-content>
  </main>
</div>
