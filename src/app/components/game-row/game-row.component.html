<div class="game-row">
  <div class="game-row__cover" [style.background]="coverGradient()">
    @if (coverImageUrl(); as imageUrl) {
      <img class="game-row__image" [src]="imageUrl" [alt]="title()" loading="lazy" />
    } @else {
      <span class="game-row__initials">{{ coverInitials() }}</span>
    }
  </div>

  <div class="game-row__info">
    <div class="game-row__title">{{ title() }}</div>

    <div class="game-row__meta">
      <div class="game-row__platforms">
        @for (platform of platforms(); track platform) {
          <span class="tag" [class.tag--muted]="!matchesFilter(platform)">
            <app-platform-icon [platform]="platform" />
            {{ platform }}
          </span>
        }
      </div>

      <span class="game-row__days">{{ daysUntilRelease() | daysUntil }}</span>
    </div>
  </div>
</div>
