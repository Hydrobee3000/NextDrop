<div class="game-row">
  <div class="game-row__cover" [style.background]="game().coverGradient">
    @if (game().coverImageUrl; as imageUrl) {
      <img class="game-row__image" [src]="imageUrl" [alt]="game().title" loading="lazy" />
    } @else {
      <span class="game-row__initials">{{ game().coverInitials }}</span>
    }
  </div>

  <div class="game-row__info">
    <div class="game-row__title-row">
      <div class="game-row__title">{{ game().title }}</div>

      <button
        class="game-row__favorite"
        [class.active]="isFavorite()"
        [attr.aria-label]="isFavorite() ? 'Убрать из избранного' : 'В избранное'"
        (click)="toggleFavorite($event)"
      >
        <svg lucideHeart></svg>
      </button>
    </div>

    <div class="game-row__meta">
      <div class="game-row__platforms">
        @for (platform of game().platforms; track platform) {
          <span
            class="tag"
            [class.tag--muted]="!matchesFilter(platform)"
            [attr.data-icon-kind]="iconKind(platform)"
          >
            <app-platform-icon [platform]="platform" />
            <span class="tag__label">{{ platform }}</span>
          </span>
        }
      </div>

      <span class="game-row__days">{{ game().daysUntilRelease | daysUntil }}</span>
    </div>
  </div>
</div>
