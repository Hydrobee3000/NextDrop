<div class="game-row">
  <div class="game-row__cover" [style.background]="coverGradient()">
    <span>{{ coverInitials() }}</span>
  </div>

  <div class="game-row__info">
    <div class="game-row__title">{{ title() }}</div>
    <span class="game-row__platforms">{{ platforms().join(', ') }}</span>
  </div>

  <span class="game-row__days">{{ daysUntilRelease() }} дн.</span>
</div>
