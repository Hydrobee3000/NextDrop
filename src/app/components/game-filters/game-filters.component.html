<div class="game-filters">
  <div class="game-filters__header">
    <div class="game-filters__title-row">
      <div class="game-filters__title-group">
        <h2>{{ titleKey() | translate }}</h2>
        @if (totalCount() > 0) {
          <span class="tactile-badge">{{ totalCount() | releaseCount }}</span>
        }
      </div>
      <app-language-switcher class="game-filters__language-switcher" />
    </div>

    <hr class="game-filters__rule" />

    <div class="game-filters__chips">
      @for (filter of filters; track filter) {
        <span
          class="game-filters__chip"
          [class.active]="filter === activeFilter()"
          (click)="select(filter)"
        >
          @if (filter !== 'all') {
            <app-platform-icon [platform]="filter" />
          }
          {{ 'filter.' + filter | translate }}
        </span>
      }
    </div>
  </div>
</div>
