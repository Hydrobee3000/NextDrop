<article class="game-card">
  <div class="game-card__cover" [style.background]="coverGradient()">
    @if (coverImageUrl(); as imageUrl) {
      <img class="game-card__image" [src]="imageUrl" [alt]="title()" loading="lazy" />
    } @else {
      <span class="game-card__initials">{{ coverInitials() }}</span>
    }
  </div>

  <div class="game-card__body">
    <h3 class="game-card__title">{{ title() }}</h3>

    <div class="game-card__meta">
      <div class="game-card__platforms">
        @for (platform of platforms(); track platform) {
          <span class="tag">{{ platform }}</span>
        }
      </div>

      <span class="game-card__days">{{ daysUntilRelease() }} дн.</span>
    </div>
  </div>
</article>
